# Solomon's Key (USA) iNES image layout.
#
# The upstream preservation listing uses PRG_BANK_0 for the complete 32 KiB
# CPU image and PRG_BANK_1 for the complete 32 KiB CHR image.  The latter name
# is historical; keeping it here allows the imported listing to remain byte
# stable while its semantic modularization proceeds.

MEMORY {
    HEADER: file = %O, start = $0000, size = $0010, fill = yes;
    PRG:    file = %O, start = $8000, size = $8000, fill = yes;
    CHR:    file = %O, start = $0000, size = $8000, fill = yes;
}

SEGMENTS {
    HEADER:     load = HEADER, type = ro;
    PRG_NMI:    load = PRG,    type = ro;
    PRG_PRE_STARTUP: load = PRG, type = ro;
    PRG_STARTUP: load = PRG, type = ro;
    PRG_SCHEDULER: load = PRG, type = ro;
    PRG_PRE_MAIN_THREAD: load = PRG, type = ro;
    PRG_MAIN_THREAD: load = PRG, type = ro;
    PRG_PRE_TIMER: load = PRG, type = ro;
    PRG_TIMER: load = PRG, type = ro;
    PRG_PRE_TIMER_DISPLAY: load = PRG, type = ro;
    PRG_TIMER_DISPLAY: load = PRG, type = ro;
    PRG_ENEMY_MOVEMENT: load = PRG, type = ro;
    PRG_ENEMY_AI_DISPATCH: load = PRG, type = ro;
    PRG_PRE_FIREBALL_LIFETIME: load = PRG, type = ro;
    PRG_FIREBALL_LIFETIME: load = PRG, type = ro;
    PRG_ENEMY_INITIALIZATION: load = PRG, type = ro;
    PRG_ENEMY_TYPE_CONFIGURATION: load = PRG, type = ro;
    PRG_ENEMY_TYPE_DATA: load = PRG, type = ro;
    PRG_BANK_0: load = PRG,    type = ro;
    PRG_BANK_1: load = CHR,    type = ro;
}
